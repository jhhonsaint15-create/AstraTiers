<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>AstraTiers Ranking</title>

<style>

body{
    margin:0;
    background:#0b0f19;
    color:white;
    font-family:Arial;
}

header{
    background:#111827;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#8b5cf6;
    font-size:28px;
    font-weight:bold;
}

.menu{
    display:flex;
    gap:10px;
}

button{
    background:#1f2937;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#8b5cf6;
}

.container{
    width:90%;
    margin:auto;
}

.admin{
    display:none;
    background:#111827;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}

input,select{
    padding:10px;
    margin:5px;
    border-radius:6px;
    border:0;
}

.modos{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:30px;
}

.player{
    background:#111827;
    padding:15px;
    margin:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}

.tiers{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:20px;
}

.tier{
    background:#111827;
    width:160px;
    min-height:180px;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.tier h2{
    color:#8b5cf6;
}

</style>

</head>

<body>


<header>

<div class="logo">
AstraTiers
</div>


<div class="menu">

<a href="index.html">
<button>
Home
</button>
</a>


<button onclick="entrarAdmin()">
Admin
</button>


</div>

</header>


<div class="container">


<div id="painel" class="admin">


<h2>Painel Admin</h2>


<input id="nick" placeholder="Nick">

<input id="regiao" placeholder="Região">


<select id="modo">

<option>Vanilla</option>
<option>Sword</option>
<option>Axe</option>
<option>UHC</option>
<option>Pot</option>
<option>NethPot</option>
<option>SMP</option>
<option>Mace</option>

</select>


<select id="tier">

<option>HT1</option>
<option>HT2</option>
<option>HT3</option>
<option>HT4</option>
<option>HT5</option>

</select>


<button onclick="adicionar()">
Salvar
</button>


</div><div class="modos">

<button onclick="mostrar('ALL')">ALL</button>
<button onclick="mostrar('Vanilla')">Vanilla</button>
<button onclick="mostrar('Sword')">Sword</button>
<button onclick="mostrar('Axe')">Axe</button>
<button onclick="mostrar('UHC')">UHC</button>
<button onclick="mostrar('Pot')">Pot</button>
<button onclick="mostrar('NethPot')">NethPot</button>
<button onclick="mostrar('SMP')">SMP</button>
<button onclick="mostrar('Mace')">Mace</button>

</div>


<h1 id="titulo">
ALL Ranking
</h1>


<div id="conteudo"></div>


</div>



<script>


let senhaAdmin="AstraTiers_Admin_2026_MCTiers_Ranking_Seguro_8472_Xp9KzL5Qw3Vn8Rt6Yh1";


let admin=false;


let jogadores =
JSON.parse(localStorage.getItem("jogadores")) || [];





function entrarAdmin(){


let senha=prompt("Código Admin");


if(senha==senhaAdmin){


admin=true;


document.getElementById("painel").style.display="block";


alert("Admin liberado");


mostrar("ALL");


}

else{

alert("Código errado");

}


}




function adicionar(){


if(!admin)return;


jogadores.push({

nick:document.getElementById("nick").value,

regiao:document.getElementById("regiao").value,

modo:document.getElementById("modo").value,

tier:document.getElementById("tier").value

});


salvar();


mostrar("ALL");


}




function excluir(i){


if(!admin)return;


jogadores.splice(i,1);


salvar();


mostrar("ALL");


}




function salvar(){


localStorage.setItem(
"jogadores",
JSON.stringify(jogadores)
);


}




function mostrar(modo){


let conteudo=document.getElementById("conteudo");


document.getElementById("titulo").innerHTML =
modo+" Ranking";


conteudo.innerHTML="";



if(modo=="ALL"){


jogadores.forEach((j,i)=>{


conteudo.innerHTML+=`


<div class="player">


<span>

#${i+1} ${j.nick} | ${j.regiao} | ${j.modo}: ${j.tier}

</span>


${admin ?

`

<button onclick="excluir(${i})">

Excluir

</button>

`

:

""

}


</div>


`;


});


}

else{


conteudo.innerHTML=`

<div class="tiers">

${criarTier("HT1",modo)}

${criarTier("HT2",modo)}

${criarTier("HT3",modo)}

${criarTier("HT4",modo)}

${criarTier("HT5",modo)}

</div>

`;

}


}




function criarTier(tier,modo){


let nomes="";


jogadores.forEach(j=>{


if(j.modo==modo && j.tier==tier){


nomes+=`

<p>${j.nick}</p>

`;

}


});


return `

<div class="tier">

<h2>${tier}</h2>

${nomes}

</div>

`;

}




mostrar("ALL");


</script>


</body>

</html>
