<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>AstraTiers Ranking</title>


<style>

body{

margin:0;
background:#070b14;
color:white;
font-family:Arial;

}



header{

background:#111827;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;

}



.logo{

font-size:35px;
font-weight:bold;
color:#8b5cf6;

}



button{

background:#8b5cf6;
color:white;
border:0;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}


button:hover{

background:#7c3aed;

}



.container{

width:90%;
margin:auto;

}



.admin{

display:none;
background:#111827;
padding:20px;
border-radius:15px;
margin-top:20px;

}



input,select{

padding:10px;
margin:5px;
border-radius:8px;
border:0;

}



.modos{

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:30px;

}



.player{

background:#111827;
padding:15px;
margin:10px;
border-radius:12px;

}



.tiers{

display:grid;
grid-template-columns:repeat(5,150px);
justify-content:center;
gap:20px;

}



.tier{

background:#111827;
padding:20px;
border-radius:15px;
text-align:center;

}



.tier h2{

color:#8b5cf6;

}



</style>


</head>



<body>



<header>


<div class="logo">
AstraTiers
</div>


<div>

<a href="index.html">

<button>
Home
</button>

</a>


<button onclick="loginAdmin()">

Admin

</button>


</div>


</header>



<div class="container">



<div id="admin" class="admin">


<h2>Painel Admin</h2>


<input id="nick" placeholder="Nick">


<input id="regiao" placeholder="Região">


<select id="modo">

</select>


<select id="tier">

<option>HT1</option>
<option>HT2</option>
<option>HT3</option>
<option>HT4</option>
<option>HT5</option>

<option>LT1</option>
<option>LT2</option>
<option>LT3</option>
<option>LT4</option>
<option>LT5</option>


</select>



<button onclick="addPlayer()">

Adicionar

</button>


</div><div class="modos" id="botoesModos">

<button onclick="show('ALL')">
ALL Ranking
</button>

</div>


<h1 id="titulo">
ALL Ranking
</h1>


<div id="conteudo"></div>



</div>




<script>


let senhaAdmin =
"AstraTiers_Admin_2026_MCTiers_Ranking_Seguro_8472_Xp9KzL5Qw3Vn8Rt6Yh1";



let admin=false;



let jogadores =
JSON.parse(localStorage.getItem("jogadores")) || [];



// ATÉ 15 MODOS

let modos =
JSON.parse(localStorage.getItem("modos")) || 
[
"Vanilla",
"Sword",
"Axe",
"UHC",
"Pot",
"NethPot",
"SMP",
"Mace"
];





function carregarModos(){


let select =
document.getElementById("modo");


select.innerHTML="";



modos.forEach(m=>{


select.innerHTML +=
`
<option>${m}</option>
`;



});





let botoes =
document.getElementById("botoesModos");



botoes.innerHTML =

`
<button onclick="show('ALL')">
ALL Ranking
</button>
`;



modos.forEach(m=>{


botoes.innerHTML +=

`

<button onclick="show('${m}')">

${m}

</button>

`;



});


}



carregarModos();






function loginAdmin(){


let senha =
prompt("Código Admin");



if(senha===senhaAdmin){


admin=true;


document.getElementById("admin").style.display="block";


alert("Admin liberado");


}

else{


alert("Senha errada");


}


}







function addPlayer(){


if(!admin)return;



jogadores.push({

nick:nick.value,

regiao:regiao.value,

modo:modo.value,

tier:tier.value


});



save();


show("ALL");


}






function save(){


localStorage.setItem(
"jogadores",
JSON.stringify(jogadores)
);


}






function converterTier(t){


if(t=="HT1" || t=="LT1")
return "Tier 1";


if(t=="HT2" || t=="LT2")
return "Tier 2";


if(t=="HT3" || t=="LT3")
return "Tier 3";


if(t=="HT4" || t=="LT4")
return "Tier 4";


if(t=="HT5" || t=="LT5")
return "Tier 5";


}





function excluir(i){


if(!admin)return;


jogadores.splice(i,1);


save();


show("ALL");


}
function show(modo){


let conteudo =
document.getElementById("conteudo");



document.getElementById("titulo").innerHTML =
modo+" Ranking";



conteudo.innerHTML="";





// ALL RANKING

if(modo=="ALL"){



let jogadoresUnicos = {};



jogadores.forEach((j,i)=>{


if(!jogadoresUnicos[j.nick]){


jogadoresUnicos[j.nick]=[];


}



jogadoresUnicos[j.nick].push(

j.modo + ": " + j.tier

);



});






Object.keys(jogadoresUnicos).forEach(nick=>{


conteudo.innerHTML +=

`

<div class="player">


<b>${nick}</b>

<br>

${jogadoresUnicos[nick].join(" | ")}



${admin ?

`

<br><br>

<button onclick="excluir(${Object.keys(jogadoresUnicos).indexOf(nick)})">

Excluir

</button>

`

:

""

}



</div>


`;



});



}






// MODOS INDIVIDUAIS

else{



conteudo.innerHTML=

`

<div class="tiers">

</div>

`;



let area =
document.querySelector(".tiers");




let lista=[

"Tier 1",
"Tier 2",
"Tier 3",
"Tier 4",
"Tier 5"

];





lista.forEach(t=>{



let nomes="";



jogadores.forEach(j=>{


if(
j.modo==modo &&
converterTier(j.tier)==t
){


nomes +=

`

<p>
${j.nick}
</p>

`;



}



});





area.innerHTML +=

`

<div class="tier">


<h2>

${t}

</h2>


${nomes}


</div>


`;



});



}





}







show("ALL");



</script>



</body>


</html>
