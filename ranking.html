<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<title>AstraTiers Rankings</title>

<style>

body{
    margin:0;
    background:#0b0f19;
    color:white;
    font-family:Arial, sans-serif;
}


header{
    background:#111827;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    color:#8b5cf6;
    font-size:30px;
    font-weight:bold;
}


.menu{
    display:flex;
    gap:10px;
}


button{
    background:#1f2937;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}


button:hover{
    background:#8b5cf6;
}


a{
    text-decoration:none;
}


.container{
    width:90%;
    margin:auto;
}


.admin{
    display:none;
    background:#111827;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
}


input,select{
    padding:10px;
    margin:5px;
    border-radius:6px;
    border:0;
}


.modos{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:30px;
}


.player{
    background:#111827;
    padding:15px;
    margin:10px;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}


/* TIERS HORIZONTAL */

.tiers{

    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    justify-content:center;
    align-items:flex-start;
    gap:15px;
    overflow-x:auto;

}



.tier{

    background:#111827;
    width:130px;
    min-width:130px;
    min-height:150px;
    padding:15px;
    border-radius:10px;
    text-align:center;

}


.tier h2{
    color:#8b5cf6;
}


</style>

</head>


<body>


<header>

<div class="logo">
AstraTiers
</div>


<div class="menu">


<a href="index.html">
<button>
Home
</button>
</a>


<button onclick="loginAdmin()">
Admin
</button>


</div>

</header>


<div class="container">


<div id="admin" class="admin">


<h2>Painel Admin</h2>


<input id="nick" placeholder="Nick">


<input id="regiao" placeholder="Região"><select id="modo">

<option>Vanilla</option>
<option>Sword</option>
<option>Axe</option>
<option>UHC</option>
<option>Pot</option>
<option>NethPot</option>
<option>SMP</option>
<option>Mace</option>

</select>



<select id="tier">

<option>HT1</option>
<option>HT2</option>
<option>HT3</option>
<option>HT4</option>
<option>HT5</option>

<option>LT1</option>
<option>LT2</option>
<option>LT3</option>
<option>LT4</option>
<option>LT5</option>

</select>



<button onclick="addPlayer()">
Adicionar
</button>


</div>




<div class="modos">

<button onclick="show('ALL')">
ALL
</button>

<button onclick="show('Vanilla')">
Vanilla
</button>

<button onclick="show('Sword')">
Sword
</button>

<button onclick="show('Axe')">
Axe
</button>

<button onclick="show('UHC')">
UHC
</button>

<button onclick="show('Pot')">
Pot
</button>

<button onclick="show('NethPot')">
NethPot
</button>

<button onclick="show('SMP')">
SMP
</button>

<button onclick="show('Mace')">
Mace
</button>

</div>



<h1 id="titulo">
ALL Ranking
</h1>


<div id="conteudo"></div>


</div>




<script>


let senhaAdmin =
"AstraTiers_Admin_2026_MCTiers_Ranking_Seguro_8472_Xp9KzL5Qw3Vn8Rt6Yh1";



let admin=false;



let jogadores =
JSON.parse(localStorage.getItem("jogadores")) || [];





function loginAdmin(){


let senha=prompt("Código Admin");



if(senha===senhaAdmin){


admin=true;


document.getElementById("admin").style.display="block";


alert("Admin liberado");


}


else{


alert("Código errado");


}


}





function addPlayer(){


if(!admin)return;



jogadores.push({


nick:nick.value,

regiao:regiao.value,

modo:modo.value,

tier:tier.value


});



save();


show("ALL");


}






function excluir(i){


if(!admin)return;



jogadores.splice(i,1);



save();



show("ALL");


}






function save(){


localStorage.setItem(
"jogadores",
JSON.stringify(jogadores)
);


}





function show(modo){


let conteudo=document.getElementById("conteudo");


document.getElementById("titulo").innerHTML =
modo+" Ranking";



conteudo.innerHTML="";



if(modo=="ALL"){


jogadores.forEach((j,i)=>{


conteudo.innerHTML+=`

<div class="player">


<span>

#${i+1} ${j.nick} | ${j.regiao} | ${j.modo}: ${j.tier}

</span>


${admin ?

`

<button onclick="excluir(${i})">

Excluir

</button>

`

:

""

}


</div>


`;



});


}

else{


conteudo.innerHTML = `

<div class="tiers">

`;let lista = [

"HT1",
"HT2",
"HT3",
"HT4",
"HT5",
"LT1",
"LT2",
"LT3",
"LT4",
"LT5"

];


lista.forEach(tier=>{


let nomes="";



jogadores.forEach(j=>{


if(j.modo==modo && j.tier==tier){


nomes+=`

<p>
${j.nick}
</p>

`;

}


});



conteudo.innerHTML+=`

<div class="tier">

<h2>${tier}</h2>

${nomes}

</div>

`;



});



conteudo.innerHTML+=`

</div>

`;



}


}



show("ALL");


</script>


</body>

</html>
